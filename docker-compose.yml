services:
  mysql:
    image: mysql:8.0
    container_name: clinicdesk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-clinicdesk}
      MYSQL_USER: ${MYSQL_USER:-clinicdesk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-clinicdesk123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: abhishekbatra123/minio:latest
    container_name: clinicdesk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clinicadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-clinicpass123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
    driver: local
  minio_data:
    driver: local
